name: Python learning tests
on:
  push:
    paths:
      - 'examples/**'
      - 'tests/**'
      - 'tools/**'
      - 'course/**'
      - 'README.md'
      - '.github/workflows/python-learning-tests.yml'
  pull_request:
    paths:
      - 'examples/**'
      - 'tests/**'
      - 'tools/**'
      - 'course/**'
      - 'README.md'
      - '.github/workflows/python-learning-tests.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: python -m compileall -q examples tests
      - name: Verify Python snippets and local Markdown links
        run: python tools/verify_curriculum.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
